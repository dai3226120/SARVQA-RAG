collection_name: agent
persist_diretory: agent/chroma_db
k: 5
# 日志库/切片库均为全量精确检索(faiss 暴力扫描)：
# k 参数只是"返回条数上限"而非"搜索范围"，取小不损失检索质量，只减少
# 冗余 metadata 拉取与 LLM 上下文体积。
# 隶属度检索固定取全量库中隶属度最高的一条(top-1)与 fit_threshold 比对：
# 命中即直接用该条日志存储的切片内容快照召回；未命中降级切片检索。
top_p: 5
slice_k: 5
# membership_k: 5   # 已弃用：隶属度检索固定取全量库 top-1，无需配置；未来需要多日志召回时再恢复
w1: 0.9
w2: 0.1
bleu_weight: 0.75
overlap_weight: 0.25
data_path: agent/data
md5_hex_store: agent/md5.text
md5_log_store: agent/md5_log.text
allow_knowledge_file_type: ["txt", "pdf", "md"]

# 模型配置
vlm_agent_type: "doubao"  # 可选: doubao (使用 mainagent_rscsv), internvl (使用 mainagent_internVL_rscsv)
chunk_size: 500 # 从 200 放大到 500，保证专业学术段落、公式、定义的完整语义
chunk_overlap: 50 # 保持 10% 左右的重叠度，防止边缘信息丢失
separators: ["\n\n", "\n", " ", ""] # 💡 移除 . 和 !，引入空格，完美适配英文语料切片，防止专业术语/浮点数被切断

# 以下是你原有的高级聚类配置，保持原样：
clustering:
  n_clusters: 50
  slice_size: 5

collections:
  slices: "sar_slices_collection"

retrieval:
  fit_threshold: 0.65
  enable_rag_context: false   # 是否在混合检索阶段 0 启用 RAG 知识库向量检索
