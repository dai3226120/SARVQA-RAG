# ====================== Agent 模型名称配置 ======================
chat_model_name: qwen3-max
embedding_model_name: text-embedding-v4
huggingface_embedding_model_name: BAAI/bge-m3
huggingface_embedding_device: auto   # 推理设备: auto(有GPU用GPU)/cuda/cpu

# ====================== Doubao 1.5 Lite 配置（LLM 判断专用） ======================
doubao-1-5-lite_model_name: doubao-1-5-lite-32k-250115
doubao_1_5_lite_timeout: 30
doubao_1_5_lite_temperature: 0.7
doubao_1_5_lite_thinking_mode: "disabled"

# ====================== Doubao Seed 配置 ======================
doubao-seed-2-0-mini_model_name: doubao-seed-2-0-mini-260428
doubao_seed_api_endpoint: "https://ark.cn-beijing.volces.com/api/v3"
doubao_seed_full_endpoint: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
doubao_seed_timeout: 30
doubao_seed_thinking_mode: "disabled"

# ====================== InternVL 配置 ======================
internvl2-8b_model_name: OpenGVLab/InternVL2-8B
internvl3-5-8b_model_name: OpenGVLab/InternVL3_5-8B
internvl_api_endpoint: "http://i-2.gpushare.com:31867/v1"
internvl_full_endpoint: "http://i-2.gpushare.com:31867/v1/chat/completions"
internvl_api_key: "vllm-dummy-api-key"
internvl_temperature: 0.2
internvl_timeout: 30
internvl_max_tokens: 512   # 输出上限：限长兜底（Qwen3 底座默认 thinking，20480 会给长文放飞空间；512 对直答足够）

# ====================== 独立 vLLM/OpenAI 兼容部署模型配置（tinygptv / geochat / skyeyegpt）======================
# 每个模型可单独覆盖 模型名/端点/API Key/温度/输出上限；
# 未配置的字段自动沿用 InternVL 的部署参数（端点 31867、输出上限 internvl_max_tokens）。
# ⚠️ model_name 的值 = vLLM 服务端实际提供的模型名
#    （启动参数 --served-model-name 指定的名字；未指定时为模型路径名，如 OpenGVLab/InternVL3_5-8B）
# ⚠️ 改名：发布正式模型时把 tinygptv / model-2/3 替换为正式模型名，并同步修改
#    config/eval.yml、config/__init__.py、model/factory.py、benchmark/models/vllm_models.py、
#    benchmark/models/__init__.py、benchmark/main_eval.py

# ---- tinygptv（TinyGPT-V / SAR-GPT，vLLM 部署；服务端内部 localhost:8080，
#     公网统一映射为 i-2.gpushare.com:31867，与 InternVL 同一对外端点）----
tinygptv_model_name: "tinygptv"
tinygptv_api_endpoint: "http://i-2.gpushare.com:31867/v1"
tinygptv_max_tokens: 256    # 输出上限，须与输入合计 ≤ 服务端 max_model_len=2048（实测：2048/512 均 400，Agent 模式 RAG 上下文输入 ~1500 tokens，仅能剩 ~500 给输出）；VQA 答案较短，256 足够
tinygptv_stop: ["###"]      # 生成停止符（TinyGPT-V demo.py 用 stop=["###"]，防止模型续写下一轮模板）
# ---- 采样参数（服务端退化 bug 已修复（见部署指南 §7），输出已正常）----
tinygptv_temperature: 0.2           # 实测 0.6 偶发空输出（首 token 撞停止符），0.2 贪心化最稳定（0/5 空输出）；
# tinygptv_top_p: 0.9               # 如需调采样在下方取消注释（未配置则不传）
# tinygptv_repetition_penalty: 1.1  # vLLM 专有参数（经 extra_body 透传）

# ---- tinygptv-stage4（官方 Stage4 检查点，MiniGPT-v2 架构/[INST] 模板，448 图）----
# 与 tinygptv 同一服务端（模型在服务端手动切换），按 MODEL_KEY = "tinygptv-stage4" 区分。
# ⚠️ Stage4 与 SAR-GPT 的客户端差异：
#    1. 对中文文本极敏感（[INST] 块内任何中文 → 输出 HTML 垃圾），Agent 模式需全英文文本
#    2. Q/A 切片对最多 1 个（≥2 个触发垃圾输出）——见 agent/mainagent_tinygptv_stage4*.py
tinygptv_stage4_model_name: "tinygptv"
tinygptv_stage4_api_endpoint: "http://i-2.gpushare.com:31867/v1"
tinygptv_stage4_max_tokens: 256
tinygptv_stage4_stop: ["###"]
tinygptv_stage4_temperature: 0.2

# ---- geochat（GeoChat-7B，LLaVA-1.5 架构/Vicuna-7B 底座；vLLM 部署，公网映射 31867）----
# 部署见《GeoChat部署指南》：--served-model-name geochat-7B，max-model-len 4096，
# LLaVA-1.5 chat template（USER: <image>\n{q} ASSISTANT:）由服务端渲染。
# 客户端发裸问题（{q} 位置即问题本身），temperature 按指南 0.0（贪心）
geochat_model_name: "geochat-7B"
geochat_api_endpoint: "http://i-2.gpushare.com:31867/v1"
geochat_max_tokens: 256
geochat_temperature: 0.0

# ---- skyeyegpt（SkyEyeGPT，MiniGPT-v2 架构/EVA-ViT-g/LLaMA2-7B+LoRA）----
# 部署见《SkyEyeGPT部署指南》：MiniGPT-4 官方推理管线 + OpenAI 兼容 API（非 vLLM，但接口契约一致）；
# 服务端内部 localhost:8080，公网统一映射为 i-2.gpushare.com:31867（与 tinygptv 同一对外端点）；
# --model-id SkyEyeGPT；⚠️ 服务端为串行推理（单锁），评测并发建议调低（如 MAX_WORKERS=20）
skyeyegpt_model_name: "SkyEyeGPT"
skyeyegpt_api_endpoint: "http://i-2.gpushare.com:31867/v1"
skyeyegpt_max_tokens: 256
skyeyegpt_temperature: 0.2

# ---- imagerag（ImageRAG，InternVL2.5-8B+LoRA，vLLM 部署）----
# 部署见《ImageRAG部署指南》：vLLM 0.27.0 托管，--served-model-name imagerag；
# 服务端内部 localhost:8080，公网统一映射为 i-2.gpushare.com:31867（与 tinygptv 同一对外端点）；
# max-model-len 8192，支持多图（≤5，视觉线索检索由服务端客户端侧实现，OpenAI 接口为单主图问答）；
# 客户端发裸问题（InternVL chat template 由 vLLM 渲染），temperature 按指南 0.2
imagerag_model_name: "imagerag"
imagerag_api_endpoint: "http://i-2.gpushare.com:31867/v1"
imagerag_max_tokens: 256
imagerag_temperature: 0.2

# ====================== Qwen3.7-Plus 配置 ======================
qwen37_plus_model_name: qwen3.7-plus
qwen37_plus_api_endpoint: "https://llm-dap1vggtvuse02vt.cn-beijing.maas.aliyuncs.com/api/v1"
